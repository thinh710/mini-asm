name: CI Pipeline

on:
  push:
    branches: [homework, main]
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # JOB 1: Run Go Tests
  # ============================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: cd app/session7-deployment/backend && go mod download

      - name: Run tests
        run: cd app/session7-deployment/backend && go test ./...

      - name: Run tests with coverage
        run: |
          cd app/session7-deployment/backend
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/session7-deployment/backend/coverage.out

  # ============================================
  # JOB 2: Gosec - Go Security Scanner
  # ============================================
  gosec:
    name: Security Scan (Gosec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./app/session7-deployment/backend/...'

      - name: Upload Gosec results
        uses: actions/upload-artifact@v4
        with:
          name: gosec-results
          path: gosec.sarif

  # ============================================
  # JOB 3: Trivy - Vulnerability Scanner
  # ============================================
  trivy:
    name: Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './app/session7-deployment/backend'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          format: 'table'

  # ============================================
  # JOB 4: Gitleaks - Secret Detection
  # ============================================
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}